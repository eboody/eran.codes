<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">eran.codes runtime architecture</title>
  <desc id="desc">A high-level diagram showing browser, HTTP, app, domain, infra, SSE, and trace flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ef" />
      <stop offset="100%" stop-color="#ebe5da" />
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1d3557" />
      <stop offset="100%" stop-color="#264b7a" />
    </linearGradient>
    <linearGradient id="runtime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f6f3" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#45556b" />
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .title { font: 700 28px Georgia, 'Times New Roman', serif; fill: #162235; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #49576b; }
      .card-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #102038; }
      .card-copy { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #435064; }
      .label { font: 700 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #6b7585; }
      .hero { fill: url(#hero); stroke: #102038; stroke-width: 1.5; }
      .hero-text { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #f6f3ee; }
      .hero-copy { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #dbe5f4; }
      .card { fill: url(#runtime); stroke: #b9c4d1; stroke-width: 1.25; }
      .accent { fill: #d7e7f7; stroke: #87a8cc; stroke-width: 1; }
      .runtime-line { stroke: #45556b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .trace-line { stroke: #2a8f6a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .sse-line { stroke: #2f6fed; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .chip { fill: #eef3f8; stroke: #c9d3dd; stroke-width: 1; }
      .chip-text { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #314256; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="520" rx="28" />

  <text class="title" x="48" y="56">Runtime architecture</text>
  <text class="subtitle" x="48" y="84">The product surface, realtime delivery path, and boundary structure shown as one system.</text>

  <rect class="hero" x="48" y="118" width="248" height="112" rx="18" />
  <text class="hero-text" x="72" y="162">Browser + /lab</text>
  <text class="hero-copy" x="72" y="188">Live chat, request burst traffic,</text>
  <text class="hero-copy" x="72" y="208">auth panels, and operational timeline.</text>

  <text class="label" x="354" y="126">Boundary pipeline</text>

  <rect class="card" x="328" y="144" width="170" height="92" rx="18" />
  <text class="card-title" x="352" y="182">http</text>
  <text class="card-copy" x="352" y="206">axum router, handlers,</text>
  <text class="card-copy" x="352" y="224">Maud views, Datastar endpoints</text>

  <rect class="card" x="540" y="144" width="170" height="92" rx="18" />
  <text class="card-title" x="564" y="182">app</text>
  <text class="card-copy" x="564" y="206">use cases, policy,</text>
  <text class="card-copy" x="564" y="224">service contracts</text>

  <rect class="card" x="752" y="144" width="120" height="92" rx="18" />
  <text class="card-title" x="776" y="182">domain</text>
  <text class="card-copy" x="776" y="206">typed ids,</text>
  <text class="card-copy" x="776" y="224">invariants</text>

  <rect class="card" x="540" y="282" width="200" height="104" rx="18" />
  <text class="card-title" x="564" y="320">infra</text>
  <text class="card-copy" x="564" y="344">Postgres repositories,</text>
  <text class="card-copy" x="564" y="362">Argon2, migrations, config</text>

  <rect class="accent" x="48" y="302" width="248" height="84" rx="16" />
  <text class="card-title" x="72" y="338">SSE + Datastar</text>
  <text class="card-copy" x="72" y="360">Session and tab keyed streams</text>
  <text class="card-copy" x="72" y="378">drive server-authoritative UI updates.</text>

  <rect class="accent" x="328" y="420" width="412" height="62" rx="16" />
  <text class="card-title" x="352" y="458">Trace pipeline</text>
  <text class="card-copy" x="490" y="458">live operational surface + deeper diagnostic stream</text>

  <path class="runtime-line" d="M296 174 H328" />
  <path class="runtime-line" d="M498 190 H540" />
  <path class="runtime-line" d="M710 190 H752" />
  <path class="runtime-line" d="M640 236 V282" />

  <path class="sse-line" d="M172 302 V242 C172 224 204 214 328 214" />
  <path class="sse-line" d="M296 344 H500 C560 344 590 344 590 344" />

  <path class="trace-line" d="M412 236 V420" />
  <path class="trace-line" d="M640 386 V420" />
  <path class="trace-line" d="M172 230 V420 H328" />

  <rect class="chip" x="764" y="302" width="108" height="34" rx="10" />
  <text class="chip-text" x="782" y="324">Postgres</text>
  <rect class="chip" x="764" y="348" width="108" height="34" rx="10" />
  <text class="chip-text" x="788" y="370">Argon2</text>

  <text class="label" x="48" y="462">Reader takeaway</text>
  <text class="card-copy" x="48" y="488">The UI, realtime transport, typed policy layer, and storage layer are inspectable as one coherent system.</text>
</svg>
