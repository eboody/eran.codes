[package]
name = "eran_codes"
version = "0.1.1"
edition = "2024"
default-run = "eran_codes"

[workspace]

members = ["crates/domain", "crates/infra", "crates/app", "crates/http", "crates/utils"]

[dependencies]
infra = { path = "crates/infra" }
domain = { path = "crates/domain" }
app = { path = "crates/app" }
http = { path = "crates/http" }
utils = { path = "crates/utils" }
nutype = { workspace = true }


tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "fs",
] }
axum = { version = "0.8.8" }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
tower-sessions = "0.14.0"
tower-cookies = "0.11.0"

tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing = "0.1.44"
snafu = "0.8.9"

[workspace.dependencies]
nutype = "0.6.2"
moddef = "0.3.0"
strum = "0.27.2"
strum_macros = "0.27.2"

[patch.crates-io]
statum = { path = "/home/eran/code/statum/statum" }
statum-core = { path = "/home/eran/code/statum/statum-core" }
statum-macros = { path = "/home/eran/code/statum/statum-macros" }
macro_registry = { path = "/home/eran/code/statum/macro_registry" }
module_path_extractor = { path = "/home/eran/code/statum/module_path_extractor" }

[workspace.metadata.scripts]
crs = "cargo run-script"
migrate = "cargo with-db sqlx migrate run --source crates/infra/migrations"
prepare = "cargo with-db sqlx prepare --workspace -- --all-targets"
w = "watchexec --restart --exts rs,html,css,js -- cargo run --features http/live-reload"
