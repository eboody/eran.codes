[package]
name = "utils"
version = "0.1.1"
edition = "2024"

[features]
default = []
visual-snapshot = [
    "dep:clap",
    "dep:playwright",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:url",
]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive"], optional = true }
playwright = { version = "0.0.20", optional = true }
serde_json = { version = "1.0.149", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"], optional = true }
tokio-stream = { version = "0.1.18", optional = true }
url = { version = "2.5.8", optional = true }

[[bin]]
name = "visual_snapshot"
path = "src/bin/visual_snapshot.rs"
required-features = ["visual-snapshot"]
